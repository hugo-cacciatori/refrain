# The rewrite's Rust workspace (SPEC §38): the core, the Tauri app and, later, the Explorer handler.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
refrain-core = { path = "crates/refrain-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
